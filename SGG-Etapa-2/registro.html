<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Registro - SGG</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- BOTÓN DE TEMA -->

    <button
        id="btn-tema"
        onclick="cambiarTema()"
    >
        Cambiar Modo
    </button>


    <!-- FORMULARIO -->

    <div class="formulario">

        <h2>Crear Cuenta</h2>


        <form onsubmit="registrarUsuario(event)">


            <!-- NOMBRE -->

            <label for="nombre">
                Nombre/s
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Nombre/s"
                required
            >


            <!-- APELLIDO -->

            <label for="apellido">
                Apellido/s
            </label>

            <input
                type="text"
                id="apellido"
                placeholder="Apellido/s"
                required
            >


            <!-- FECHA -->

            <label for="fechaNacimiento">
                Fecha de Nacimiento
            </label>

            <input
                type="date"
                id="fechaNacimiento"
                required
            >


            <!-- EMAIL -->

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                placeholder="ejemplo@correo.com"
                required
            >


            <!-- USUARIO -->

            <label for="usuario">
                Nombre de Usuario
            </label>

            <input
                type="text"
                id="usuario"
                placeholder="Nombre de Usuario"
                required
            >


            <!-- CONTRASEÑA -->

            <label for="password">
                Contraseña
            </label>

            <div class="contenedor-password">

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >

                <button
                    type="button"
                    class="btn-ver-password"
                    onclick="mostrarOcultarPassword('password', this)"
                >
                    Mostrar
                </button>

            </div>


            <!-- REQUISITOS -->

            <ul class="requisitos-password">

                <li
                    id="req-longitud"
                    class="requisito-no"
                >
                    ✗ Mínimo 8 caracteres
                </li>

                <li
                    id="req-mayuscula"
                    class="requisito-no"
                >
                    ✗ Al menos 1 letra mayúscula
                </li>

                <li
                    id="req-minuscula"
                    class="requisito-no"
                >
                    ✗ Al menos 1 letra minúscula
                </li>

                <li
                    id="req-numero"
                    class="requisito-no"
                >
                    ✗ Al menos 1 número
                </li>

                <li
                    id="req-especial"
                    class="requisito-no"
                >
                    ✗ Al menos 1 carácter especial
                </li>

            </ul>


            <!-- REPETIR CONTRASEÑA -->

            <label for="repetirPassword">
                Repetir Contraseña
            </label>

            <div class="contenedor-password">

                <input
                    type="password"
                    id="repetirPassword"
                    placeholder="Repetir Contraseña"
                    required
                >

                <button
                    type="button"
                    class="btn-ver-password"
                    onclick="mostrarOcultarPassword('repetirPassword', this)"
                >
                    Mostrar
                </button>

            </div>


            <br>


            <!-- BOTÓN REGISTRAR -->

            <button
                type="submit"
                id="btn-registrar"
                disabled
            >
                Registrarse
            </button>


            <!-- MENSAJE -->

            <p id="mensaje"></p>


        </form>


        <!-- VOLVER -->

        <div class="navegacion">

            <a href="index.html">
                Volver al Login
            </a>

            <a href="recuperar.html">
                Recuperar contraseña
            </a>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="js/registro.js"></script>

</body>

</html>
