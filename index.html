<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button id="btn-tema" class="btn-tema">Cambiar Modo</button>

    <div class="container">
        <h1>Iniciar Sesión</h1>
        
        <form id="form-login">
            <label for="usuario">Nombre de Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Nombre de Usuario" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
            <button type="button" class="btn-mostrar" onclick="togglePassword('password')">Mostrar</button>

            <button type="submit" class="btn-principal">Ingresar</button>

            <div class="links-container">
                <a href="registro.html">Crear una cuenta</a>
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </div>

    <script src="js/login.js"></script>
    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }
    </script>
</body>
</html>
