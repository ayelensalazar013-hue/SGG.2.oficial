<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema SGG - Iniciar Sesión">
    <title>SGG - Iniciar Sesión</title>
    <!-- Ruta corregida con CSS en mayúscula -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button type="button" class="btn-tema" id="btn-tema" aria-label="Cambiar modo de color">Cambiar Modo</button>
    <main class="container">
        <h1>Iniciar Sesión</h1>
        
        <form id="form-login">
            <div class="form-group">
                <label for="usuario">Usuario o Email:</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Ingresá tu usuario o correo" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="Ingresá tu contraseña" autocomplete="current-password">
            </div>
            
            <button type="button" class="btn-mostrar" onclick="mostrarOcultarPassword('password', this)" aria-label="Mostrar u ocultar la contraseña">Mostrar</button>
            <button type="submit" class="btn-principal" id="btn-login">Ingresar</button>
        </form>

        <div id="mensaje" aria-live="polite"></div>
        <hr class="divisoria">

        <nav class="links-container">
            <a href="registro.html" class="btn-enlace">Crear cuenta</a>
            <a href="recuperar.html" class="btn-enlace">Recuperar contraseña</a>
        </nav>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
