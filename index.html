<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button type="button" class="btn-tema" id="btn-tema" onclick="cambiarTema()">Cambiar Modo</button>

    <div class="container">
        <h1>Iniciar Sesión</h1>
        
        <form id="form-login">
            <label for="usuario">Usuario o Email:</label>
            <input type="text" id="usuario" name="usuario" required placeholder="Ingresá tu usuario o correo">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Ingresá tu contraseña">
            
            <button type="button" class="btn-mostrar" onclick="mostrarOcultarPassword('password', this)">Mostrar</button>

            <button type="submit" class="btn-principal" id="btn-login">Ingresar</button>
        </form>

        <div id="mensaje"></div>

        <hr class="divisoria">

        <div class="links-container">
            <a href="registro.html" class="btn-enlace">Crear cuenta</a>
            <a href="recuperar.html" class="btn-enlace">Recuperar contraseña</a>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
