<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SGG</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="contenedor-principal">

        <!-- BOTÓN PARA CAMBIAR EL TEMA -->
        <button id="btn-tema" onclick="cambiarTema()">
            Cambiar Modo
        </button>

        <!-- CARD DE LOGIN -->
        <div class="login">

            <h2>Iniciar Sesión</h2>

            <!-- USUARIO -->
            <div class="campo">
                <input 
                    type="text" 
                    id="usuario" 
                    placeholder="Nombre de Usuario"
                >
            </div>

            <!-- CONTRASEÑA -->
            <div class="campo contenedor-password">
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Contraseña"
                >
                <button 
                    type="button" 
                    class="btn-ver-password" 
                    onclick="mostrarOcultarPassword('password', this)"
                >
                    Mostrar
                </button>
            </div>

            <!-- BOTÓN INGRESAR -->
            <button 
                id="btn-login" 
                class="btn-submit"
                onclick="login()"
            >
                Ingresar
            </button>

            <!-- MENSAJE -->
            <p id="mensaje"></p>

            <!-- NAVEGACIÓN -->
            <div class="navegacion">
                <a href="registro.html">Crear una cuenta</a>
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </div>

        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script src="js/login.js"></script>

</body>

</html>
