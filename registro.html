<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema SGG - Crear cuenta de usuario">
    <title>SGG - Crear cuenta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button type="button" class="btn-tema" id="btn-tema" aria-label="Cambiar tema de color">Cambiar Modo</button>
    <main class="container">
        <h1>Crear cuenta</h1>
        
        <form id="form-registro">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre" autocomplete="given-name">
            </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required placeholder="Tu apellido" autocomplete="family-name">
            </div>

            <div class="form-group">
                <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="usuario">Nombre de Usuario:</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Elegí un usuario" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="Creá una contraseña segura" autocomplete="new-password">
            </div>

            <ul class="password-rules" aria-live="polite">
                <li id="ruleLen">✖ Mínimo 8 caracteres</li>
                <li id="ruleMayus">✖ Al menos una mayúscula</li>
                <li id="ruleMinus">✖ Al menos una minúscula</li>
                <li id="ruleNum">✖ Al menos un número</li>
                <li id="ruleSim">✖ Al menos un símbolo (!@#$%^&*)</li>
            </ul>

            <button type="button" class="btn-mostrar" onclick="mostrarOcultarPassword('password', this)" aria-label="Mostrar u ocultar contraseña">Mostrar</button>
            <button type="submit" class="btn-principal" id="btn-registro">Registrarse</button>
        </form>

        <div id="mensaje" aria-live="polite"></div>
        <hr class="divisoria">

        <nav class="links-container">
            <a href="index.html" class="btn-enlace">Volver al Login</a>
        </nav>
    </main>

    <script src="js/registro.js"></script>
</body>
</html>
