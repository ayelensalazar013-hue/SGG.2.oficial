<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Registro de Usuario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button type="button" class="btn-tema" id="btn-tema" onclick="cambiarTema()">Cambiar Modo</button>

    <div class="container">
        <h1>Registro de Usuario</h1>
        
        <form id="form-registro">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required placeholder="Tu apellido">

            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">

            <label for="usuario">Nombre de Usuario:</label>
            <input type="text" id="usuario" name="usuario" required placeholder="Elegí un usuario">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Creá una contraseña segura">
            
            <button type="button" class="btn-mostrar" onclick="mostrarOcultarPassword('password', this)">Mostrar</button>

            <button type="submit" class="btn-principal" id="btn-registro">Registrarse</button>
        </form>

        <div id="mensaje"></div>

        <hr class="divisoria">

        <div class="links-container">
            <a href="index.html" class="btn-enlace">Volver al Login</a>
        </div>
    </div>

    <script src="js/registro.js"></script>
</body>
</html>
