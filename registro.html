<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button id="btn-tema" class="btn-tema">Cambiar Modo</button>

    <div class="container">
        <h1>Crear Cuenta</h1>

        <form id="form-registro">
            <label for="nombre">Nombre/s</label>
            <input type="text" id="nombre" placeholder="Nombre/s" required>

            <label for="apellido">Apellido/s</label>
            <input type="text" id="apellido" placeholder="Apellido/s" required>

            <label for="fecha">Fecha de Nacimiento</label>
            <input type="date" id="fecha" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com" required>

            <label for="usuario">Nombre de Usuario</label>
            <input type="text" id="usuario" placeholder="Nombre de Usuario" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="button" class="btn-mostrar" onclick="togglePassword('password')">Mostrar</button>

            <ul>
                <li>✓ Mínimo 8 caracteres</li>
                <li>✓ Al menos 1 letra mayúscula</li>
                <li>✓ Al menos 1 letra minúscula</li>
                <li>✓ Al menos 1 número</li>
                <li>✓ Al menos 1 carácter especial</li>
            </ul>

            <button type="submit" class="btn-principal">Registrarse</button>

            <!-- LÍNEA DIVISORIA DE SEPARACIÓN -->
            <hr class="divisoria">

            <!-- BOTONES SECUNDARIOS SEPARADOS -->
            <div class="links-container">
                <a href="index.html" class="btn-enlace">Volver al Login</a>
                <a href="recuperar.html" class="btn-enlace">Recuperar contraseña</a>
            </div>
        </form>
    </div>

    <script>
        const btnTema = document.getElementById('btn-tema');
        if (btnTema) {
            btnTema.addEventListener('click', () => {
                document.body.classList.toggle('modo-oscuro');
            });
        }

        function togglePassword(idInput) {
            const input = document.getElementById(idInput);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }
    </script>
</body>
</html>
