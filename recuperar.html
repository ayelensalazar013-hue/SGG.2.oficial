<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema SGG - Recuperar Contraseña">
    <title>SGG - Recuperar Contraseña</title>
    <!-- RUTA CORREGIDA A TU CARPETA CSS/estilo.css -->
    <link rel="stylesheet" href="CSS/estilo.css">
</head>
<body>
    <button type="button" class="btn-tema" id="btn-tema" onclick="cambiarTema()" aria-label="Cambiar tema de color">Cambiar Modo</button>

    <main class="container">
        <h1>Recuperar Contraseña</h1>
        
        <form id="form-recuperar">
            <label for="email">Correo Electrónico Registrado:</label>
            <input type="email" id="email" name="email" required placeholder="Ingresá tu email" autocomplete="email">

            <label for="nuevaPassword">Nueva Contraseña:</label>
            <input type="password" id="nuevaPassword" name="nuevaPassword" required placeholder="Ingresá tu nueva clave" autocomplete="new-password">
            
            <!-- LISTA DE LAS 5 REGLAS EN RECUPERACIÓN (RF-04) -->
            <ul class="password-rules">
                <li id="ruleLen">✖ Mínimo 8 caracteres</li>
                <li id="ruleMayus">✖ Al menos una mayúscula</li>
                <li id="ruleMinus">✖ Al menos una minúscula</li>
                <li id="ruleNum">✖ Al menos un número</li>
                <li id="ruleSim">✖ Al menos un símbolo (!@#$%^&*)</li>
            </ul>

            <label for="confirmarPassword">Confirmar Nueva Contraseña:</label>
            <input type="password" id="confirmarPassword" name="confirmarPassword" required placeholder="Repetía la contraseña" autocomplete="new-password">
            
            <button type="button" class="btn-mostrar" onclick="mostrarOcultarPassword('nuevaPassword', this)" aria-label="Mostrar u ocultar contraseña">Mostrar</button>
            <button type="submit" class="btn-principal" id="btn-recuperar">Actualizar Contraseña</button>
        </form>

        <div id="mensaje" aria-live="polite"></div>

        <hr class="divisoria">

        <nav class="links-container">
            <a href="index.html" class="btn-enlace">Volver al Login</a>
        </nav>
    </main>

    <script src="js/recuperar.js"></script>
</body>
</html>
