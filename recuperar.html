<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button type="button" class="btn-tema" id="btn-tema" onclick="cambiarTema()">Cambiar Modo</button>

    <div class="container">
        <h1>Recuperar Contraseña</h1>
        
        <form id="form-recuperar">
            <label for="email">Correo Electrónico Registrado:</label>
            <input type="email" id="email" name="email" required placeholder="Ingresá tu email">

            <label for="nuevaPassword">Nueva Contraseña:</label>
            <input type="password" id="nuevaPassword" name="nuevaPassword" required placeholder="Ingresá tu nueva clave">

            <label for="confirmarPassword">Confirmar Nueva Contraseña:</label>
            <input type="password" id="confirmarPassword" name="confirmarPassword" required placeholder="Repetía la contraseña">
            
            <button type="button" class="btn-mostrar" onclick="mostrarOcultarPassword('nuevaPassword', this)">Mostrar</button>

            <button type="submit" class="btn-principal" id="btn-recuperar">Actualizar Contraseña</button>
        </form>

        <div id="mensaje"></div>

        <hr class="divisoria">

        <div class="links-container">
            <a href="index.html" class="btn-enlace">Volver al Login</a>
        </div>
    </div>

    <script src="js/recuperar.js"></script>
</body>
</html>
