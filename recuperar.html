<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="modo-noche">
    <button id="btnTema" class="btn-tema">Cambiar Modo</button>

    <div class="dashboard-card">
        <h1>Recuperar Contraseña</h1>
        <form id="formRecuperar">
            <div class="field-group">
                <label for="recEmail">Correo Electrónico Registrado:</label>
                <input type="email" id="recEmail" placeholder="Ingresá tu email" required>
            </div>

            <div class="field-group">
                <label for="nuevaPass">Nueva Contraseña:</label>
                <input type="password" id="nuevaPass" placeholder="Ingresá tu nueva clave" required>
            </div>

            <div class="field-group">
                <label for="confirmPass">Confirmar Nueva Contraseña:</label>
                <input type="password" id="confirmPass" placeholder="Repetía la contraseña" required>
            </div>

            <ul class="password-rules">
                <li id="rule-length" class="rule-item invalid">✖ Mínimo 8 caracteres</li>
                <li id="rule-upper" class="rule-item invalid">✖ Al menos 1 mayúscula</li>
                <li id="rule-lower" class="rule-item invalid">✖ Al menos 1 minúscula</li>
                <li id="rule-num" class="rule-item invalid">✖ Al menos 1 número</li>
                <li id="rule-spec" class="rule-item invalid">✖ Al menos 1 símbolo (!@#$%^&*)</li>
            </ul>

            <button type="button" id="btnMostrar" class="btn-marrón-secundario">Mostrar</button>
            <button type="submit" id="btnActualizar" class="btn-marrón" disabled>Actualizar Contraseña</button>
        </form>

        <div id="mensajeError" class="error-text"></div>

        <hr class="divisoria">
        <div>
            <a href="login.html" class="btn-enlace">Volver al Login</a>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        // Modo Claro / Oscuro
        const btnTema = document.getElementById("btnTema");
        const temaGuardado = localStorage.getItem("tema") || "oscuro";
        if (temaGuardado === "oscuro") {
            document.body.classList.add("modo-noche");
            document.body.setAttribute("data-tema", "oscuro");
        } else {
            document.body.classList.remove("modo-noche");
            document.body.setAttribute("data-tema", "claro");
        }

        if (btnTema) {
            btnTema.addEventListener("click", () => {
                document.body.classList.toggle("modo-noche");
                const esOscuro = document.body.classList.contains("modo-noche");
                document.body.setAttribute("data-tema", esOscuro ? "oscuro" : "claro");
                localStorage.setItem("tema", esOscuro ? "oscuro" : "claro");
            });
        }

        // Mostrar / Ocultar Contraseña
        const btnMostrar = document.getElementById("btnMostrar");
        if (btnMostrar) {
            btnMostrar.addEventListener("click", () => {
                const p1 = document.getElementById("nuevaPass");
                const p2 = document.getElementById("confirmPass");
                const nuevoTipo = p1.type === "password" ? "text" : "password";
                p1.type = nuevoTipo;
                p2.type = nuevoTipo;
                btnMostrar.textContent = nuevoTipo === "text" ? "Ocultar" : "Mostrar";
            });
        }

        // Evaluación de Reglas y Doble Coincidencia
        const nuevaPassInput = document.getElementById("nuevaPass");
        const confirmPassInput = document.getElementById("confirmPass");
        const btnActualizar = document.getElementById("btnActualizar");

        function evaluarPassword(texto) {
            const reglas = {
                "rule-length": texto.length >= 8,
                "rule-upper": /[A-Z]/.test(texto),
                "rule-lower": /[a-z]/.test(texto),
                "rule-num": /[0-9]/.test(texto),
                "rule-spec": /[!@#$%^&*(),.?":{}|<>]/.test(texto)
            };

            let todasOK = true;
            Object.keys(reglas).forEach(id => {
                const el = document.getElementById(id);
                const cumple = reglas[id];
                if (el) {
                    el.className = `rule-item ${cumple ? 'valid' : 'invalid'}`;
                    const textoBase = el.textContent.replace(/^[✔✖]\s*/, "");
                    el.textContent = `${cumple ? '✔' : '✖'} ${textoBase}`;
                }
                if (!cumple) todasOK = false;
            });

            return todasOK;
        }

        const validarForm = () => {
            const passValida = evaluarPassword(nuevaPassInput.value);
            const coinciden = nuevaPassInput.value === confirmPassInput.value && confirmPassInput.value !== "";
            btnActualizar.disabled = !(passValida && coinciden);
        };

        nuevaPassInput.addEventListener("input", validarForm);
        confirmPassInput.addEventListener("input", validarForm);

        // Envío de Cambio de Clave
        const formRecuperar = document.getElementById("formRecuperar");
        const mensajeError = document.getElementById("mensajeError");

        if (formRecuperar) {
            formRecuperar.addEventListener("submit", (e) => {
                e.preventDefault();
                mensajeError.textContent = "";

                const email = document.getElementById("recEmail").value.trim();
                const nuevaPass = nuevaPassInput.value;
                const usuariosGuardados = JSON.parse(localStorage.getItem("usuarios") || "[]");
                const index = usuariosGuardados.findIndex(u => u.email === email);

                if (index === -1) {
                    mensajeError.textContent = "El correo ingresado no pertenece a ningún usuario registrado.";
                    return;
                }

                if (usuariosGuardados[index].pass === nuevaPass) {
                    mensajeError.textContent = "La nueva contraseña no puede ser idéntica a la contraseña actual.";
                    return;
                }

                usuariosGuardados[index].pass = nuevaPass;
                localStorage.setItem("usuarios", JSON.stringify(usuariosGuardados));

                alert("Contraseña actualizada con éxito.");
                window.location.href = "login.html";
            });
        }
    });
    </script>
</body>
</html>
