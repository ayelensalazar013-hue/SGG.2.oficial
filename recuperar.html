<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button id="btn-tema" class="btn-tema">Cambiar Modo</button>

    <div class="container">
        <h1>Recuperar Contraseña</h1>

        <form id="form-recuperar">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="Correo electrónico" required>

            <label for="nueva-pass">Nueva Contraseña</label>
            <input type="password" id="nueva-pass" placeholder="Nueva Contraseña" required>
            <button type="button" class="btn-mostrar" onclick="togglePassword('nueva-pass')">Mostrar</button>

            <ul>
                <li>✓ Mínimo 8 caracteres</li>
                <li>✓ Al menos 1 letra mayúscula</li>
                <li>✓ Al menos 1 letra minúscula</li>
                <li>✓ Al menos 1 número</li>
                <li>✓ Al menos 1 carácter especial</li>
            </ul>

            <label for="repetir-pass">Repetir Contraseña</label>
            <input type="password" id="repetir-pass" placeholder="Repetir Contraseña" required>
            <button type="button" class="btn-mostrar" onclick="togglePassword('repetir-pass')">Mostrar</button>

            <button type="submit" class="btn-principal">Cambiar Contraseña</button>

            <!-- LÍNEA DIVISORIA DE SEPARACIÓN -->
            <hr class="divisoria">

            <div class="links-container">
                <a href="index.html" class="btn-enlace">Volver al Login</a>
                <a href="registro.html" class="btn-enlace">Crear una cuenta</a>
            </div>
        </form>
    </div>

    <script>
        const btnTema = document.getElementById('btn-tema');
        if (btnTema) {
            btnTema.addEventListener('click', () => {
                document.body.classList.toggle('modo-oscuro');
            });
        }

        function togglePassword(idInput) {
            const input = document.getElementById(idInput);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }
    </script>
</body>
</html>
