<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Gestión de Gastos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button id="btnTheme" class="btn-tema">Cambiar Modo</button>

    <div class="dashboard-card">
        <h2>Panel de Gestión de Gastos</h2>
        <p class="user-display">Usuario activo: <strong id="userEmail">...</strong></p>
        <button id="btnLogout" class="btn-marrón-secundario">Cerrar Sesión</button>

        <hr>

        <!-- Panel de Resumen (RF-09) -->
        <div class="resumen-box">
            <h3>Total Gastado</h3>
            <span id="totalGastado" class="total-monto">$0.00</span>
        </div>

        <!-- Formulario (RF-05 y RF-07) -->
        <form id="formGasto" class="form-gastos">
            <h3 id="formTitle">Cargar Nuevo Gasto</h3>
            <input type="hidden" id="gastoId">

            <div class="field-group">
                <label for="monto">Monto ($):</label>
                <input type="number" id="monto" placeholder="Ej: 1500" step="0.01" required>
            </div>

            <div class="field-group">
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="field-group">
                <label for="categoria">Categoría:</label>
                <select id="categoria" required>
                    <option value="" disabled selected>Seleccione una categoría</option>
                    <option value="Alimentación">Alimentación</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Servicios">Servicios</option>
                    <option value="Ocio">Ocio</option>
                </select>
            </div>

            <div class="field-group">
                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion" placeholder="Ej: Compra del super" required>
            </div>

            <p id="msgError" class="error-text"></p>

            <div class="actions-group">
                <button type="submit" id="btnGuardar" class="btn-marrón">Guardar Gasto</button>
                <button type="button" id="btnCancelar" class="btn-marrón-secundario" style="display: none;">Cancelar</button>
            </div>
        </form>

        <hr>

        <!-- Historial Dinámico (RF-06) -->
        <h3>Historial de Gastos</h3>
        <div class="table-wrapper">
            <table class="tabla-gastos">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Monto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaGastosBody">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal para Baja Lógica (RF-08) -->
    <div id="modalConfirm" class="modal-bg" style="display: none;">
        <div class="modal-box">
            <h3>¿Confirmar eliminación?</h3>
            <p>El gasto se desactivará de la vista activa.</p>
            <div class="modal-btns">
                <button id="btnConfirmarEliminar" class="btn-marrón">Sí, eliminar</button>
                <button id="btnCancelarEliminar" class="btn-marrón-secundario">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="js/gastos.js"></script>
</body>
</html>
