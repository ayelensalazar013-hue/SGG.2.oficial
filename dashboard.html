<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Gastos - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Bar superior con los datos de usuario y botones -->
    <header class="top-bar">
        <span id="userWelcome">Cargando usuario...</span>
        <div class="top-buttons">
            <button type="button" onclick="cambiarTema()" class="btn-secundario">Cambiar Tema</button>
            <button type="button" onclick="cerrarSesion()" class="btn-danger">Cerrar Sesión</button>
        </div>
    </header>

    <!-- Envoltorio principal mas amplio -->
    <main class="main-wrapper">
        
        <!-- Tarjeta del Formulario y Resumen -->
        <div class="card card-form">
            <div class="total-box">
                <h2>Total Gastado: <span id="totalGastado">$0.00</span></h2>
            </div>

            <div id="mensaje"></div>

            <form id="form-gasto" class="form-gastos">
                <input type="hidden" id="gastoId">

                <div class="form-group">
                    <label for="monto">Monto ($):</label>
                    <input type="number" id="monto" step="0.01" min="0.01" placeholder="Ej: 1500" required>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" required>
                        <option value="Transporte">Transporte</option>
                        <option value="Comida">Comida</option>
                        <option value="Servicios">Servicios</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <input type="text" id="descripcion" placeholder="Breve detalle" required>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-guardar-gasto" class="btn-primary">Guardar Gasto</button>
                    <button type="button" id="btn-cancelar-edicion" class="btn-secundario" onclick="cancelarEdicion()" style="display: none;">Cancelar Edición</button>
                </div>
            </form>
        </div>

        <!-- Tarjeta independiente para el Historial (Ancho completo) -->
        <div class="card card-table">
            <h3>Historial de Gastos</h3>
            <div class="table-responsive">
                <table class="tabla-gastos">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Categoría</th>
                            <th>Descripción</th>
                            <th>Monto</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaGastosBody">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal de eliminación -->
    <div id="modalConfirmar" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>¿Confirmar eliminación?</h3>
            <p>El registro dejará de mostrarse en tu historial.</p>
            <div class="modal-actions">
                <button type="button" class="btn-danger" onclick="confirmarEliminacion()">Eliminar</button>
                <button type="button" class="btn-secundario" onclick="cerrarModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="js/gastos.js"></script>
</body>
</html>
