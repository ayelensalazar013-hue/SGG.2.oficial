<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestión de Gastos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <h2>Total Gastado: <span id="totalGastado">$0.00</span></h2>

        <!-- Formulario para agregar / editar gastos -->
        <form id="formGasto">
            <input type="hidden" id="gastoId">

            <label for="monto">Monto ($):</label>
            <input type="number" id="monto" min="0.01" step="0.01" required>

            <label for="fecha">Fecha:</label>
            <!-- El atributo max se asignará automáticamente con JavaScript -->
            <input type="date" id="fecha" required>

            <label for="categoria">Categoría:</label>
            <select id="categoria" required>
                <option value="Transporte">Transporte</option>
                <option value="Comida">Comida</option>
                <option value="Servicios">Servicios</option>
                <option value="Otros">Otros</option>
            </select>

            <label for="descripcion">Descripción:</label>
            <input type="text" id="descripcion" required>

            <button type="submit" id="btnGuardar">Guardar Gasto</button>
            <button type="button" id="btnCancelar" style="display:none;">Cancelar Edición</button>
        </form>

        <section>
            <h3>Historial de Gastos</h3>
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Monto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaGastos">
                    <!-- Los gastos se cargan dinámicamente -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Vinculamos tu archivo gastos.js -->
    <script src="js/gastos.js"></script>
</body>
</html>
