<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Panel de Gastos</title>
    <style>
        :root {
            --bg-color: #f4f0e8;
            --card-bg: #ffffff;
            --text-color: #4a2c20;
            --btn-color: #6e473b;
            --btn-hover: #58372d;
            --border-color: #cbbab0;
            --input-bg: #fafafa;
            --error-color: #c62828;
            --success-color: #2e7d32;
        }

        body.modo-noche {
            --bg-color: #1a1412;
            --card-bg: #2b2320;
            --text-color: #ffffff;
            --btn-color: #8c6052;
            --btn-hover: #734d41;
            --border-color: #54433d;
            --input-bg: #211a18;
        }

        body {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            min-height: 95vh;
            box-sizing: border-box;
        }

        .top-bar {
            position: fixed;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .btn-tema, .btn-logout {
            background-color: var(--btn-color) !important;
            color: #ffffff !important;
            border: none !important;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .container {
            background: var(--card-bg) !important;
            width: 100% !important;
            max-width: 520px !important;
            padding: 25px 25px !important;
            border-radius: 14px !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05) !important;
            box-sizing: border-box !important;
            margin-top: 30px;
            display: flex !important;
            flex-direction: column !important;
        }

        /* TÍTULO MODERADO Y MÁS SOBRIO */
        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 4px;
            color: var(--text-color) !important;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .user-welcome {
            text-align: center;
            font-weight: 500;
            margin-bottom: 18px;
            opacity: 0.8;
            font-size: 0.85rem;
        }

        /* RESUMEN DEL TOTAL */
        .dashboard-summary {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 18px;
        }

        .dashboard-summary h2 {
            margin: 0 0 4px 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .total-monto {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--btn-color);
            margin: 0;
        }

        form {
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 4px;
            margin-top: 6px;
            color: var(--text-color) !important;
            font-size: 0.85rem;
        }

        input[type="number"],
        input[type="date"],
        input[type="text"],
        select {
            padding: 9px 12px !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 8px !important;
            background-color: var(--input-bg) !important;
            color: var(--text-color) !important;
            width: 100% !important;
            font-size: 0.88rem;
            box-sizing: border-box;
            margin-bottom: 6px !important;
            outline: none;
        }

        .btn-principal, .btn-cancelar {
            background-color: var(--btn-color) !important;
            color: #ffffff !important;
            border: none !important;
            padding: 10px !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            font-size: 0.9rem !important;
            cursor: pointer;
            width: 100% !important;
            margin-top: 8px !important;
        }

        .btn-cancelar {
            background-color: #757575 !important;
            margin-top: 4px !important;
        }

        .msg-box {
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            margin-top: 8px;
        }

        .msg-box.error { color: var(--error-color); }
        .msg-box.success { color: var(--success-color); }

        .divisoria {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 18px 0 14px 0 !important;
            opacity: 0.5;
        }

        /* SECCIÓN TABLA */
        h2.seccion-titulo {
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .tabla-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.82rem;
        }

        th {
            font-weight: 700;
            background-color: var(--input-bg);
        }

        .btn-tabla {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            margin-right: 2px;
        }

        .btn-editar { background-color: var(--btn-color); color: white; }
        .btn-eliminar { background-color: var(--error-color); color: white; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }

        .modal-card h3 {
            margin-top: 0;
            font-size: 1.1rem;
        }

        .modal-acciones {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button type="button" class="btn-tema" id="btn-tema" onclick="cambiarTema()">Cambiar Modo</button>
        <button type="button" class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <main class="container">
        <h1>Gestión de Gastos</h1>
        <div class="user-welcome" id="userWelcome">Cargando usuario...</div>

        <section class="dashboard-summary">
            <h2>Total Gastado</h2>
            <div class="total-monto" id="totalGastado">$0.00</div>
        </section>

        <form id="form-gasto">
            <input type="hidden" id="gastoId">
            
            <div class="form-row">
                <div class="form-group">
                    <label for="monto">Monto ($):</label>
                    <input type="number" id="monto" name="monto" step="0.01" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
            </div>

            <div class="form-group">
                <label for="categoria">Categoría:</label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Seleccionar</option>
                    <option value="Alimentación">Alimentación</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Servicios">Servicios</option>
                    <option value="Ocio">Ocio</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion" name="descripcion" required placeholder="Detalle del gasto">
            </div>

            <button type="submit" class="btn-principal" id="btn-guardar-gasto">Guardar Gasto</button>
            <button type="button" class="btn-cancelar" id="btn-cancelar-edicion" style="display: none;" onclick="cancelarEdicion()">Cancelar Edición</button>
        </form>

        <div id="mensaje" class="msg-box" aria-live="polite"></div>

        <hr class="divisoria">

        <h2 class="seccion-titulo">Historial de Gastos</h2>
        <div class="tabla-container">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Monto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaGastosBody">
                </tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="modalConfirmar">
        <div class="modal-card">
            <h3>¿Eliminar registro?</h3>
            <p style="font-size: 0.85rem;">El gasto cambiará a estado inactivo.</p>
            <div class="modal-acciones">
                <button class="btn-principal" style="background-color: var(--error-color) !important;" onclick="confirmarEliminacion()">Eliminar</button>
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="js/gastos.js"></script>
</body>
</html>
